version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: carta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - carta-network

  postgres:
    image: postgres:16-alpine
    container_name: carta-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carta}
      POSTGRES_USER: ${POSTGRES_USER:-carta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartapassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carta}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carta-network

volumes:
  redis-data:
  postgres-data:

networks:
  carta-network:
    driver: bridge
